<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicollette Libunao - Portfolio</title>
    <link rel="icon" type="image/x-icon" href="resources/N.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Scope+One&family=Jost:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'scope': ['Scope One', 'serif'],
                        'jost': ['Jost', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        
        @keyframes slide {
            0% { transform: translateY(0); opacity: 0.7; }
            50% { transform: translateY(-6px); opacity: 1; }
            100% { transform: translateY(0); opacity: 0.7; }
        }
        
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float1 {
            0% { 
                transform: translate(0, 0) scale(1);
                border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            }
            33% { 
                transform: translate(50px, -40px) scale(1.2);
                border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
            }
            66% { 
                transform: translate(-40px, 30px) scale(0.85);
                border-radius: 40% 60% 60% 40% / 60% 30% 60% 40%;
            }
            100% { 
                transform: translate(0, 0) scale(1);
                border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            }
        }

        @keyframes float2 {
            0% { 
                transform: translate(0, 0) scale(1);
                border-radius: 40% 60% 60% 40% / 40% 60% 40% 60%;
            }
            33% { 
                transform: translate(-45px, 50px) scale(0.85);
                border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%;
            }
            66% { 
                transform: translate(35px, -30px) scale(1.15);
                border-radius: 50% 50% 40% 60% / 30% 50% 70% 50%;
            }
            100% { 
                transform: translate(0, 0) scale(1);
                border-radius: 40% 60% 60% 40% / 40% 60% 40% 60%;
            }
        }

        @keyframes float3 {
            0% { 
                transform: translate(0, 0) scale(1);
                border-radius: 70% 30% 50% 50% / 60% 40% 60% 40%;
            }
            33% { 
                transform: translate(40px, 45px) scale(1.1);
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            }
            66% { 
                transform: translate(-50px, -25px) scale(0.9);
                border-radius: 50% 50% 60% 40% / 30% 60% 70% 30%;
            }
            100% { 
                transform: translate(0, 0) scale(1);
                border-radius: 70% 30% 50% 50% / 60% 40% 60% 40%;
            }
        }

        @keyframes float4 {
            0% { 
                transform: translate(0, 0) scale(1);
                border-radius: 30% 70% 70% 30% / 50% 50% 50% 50%;
            }
            33% { 
                transform: translate(-35px, -45px) scale(1.15);
                border-radius: 70% 30% 40% 60% / 60% 40% 50% 60%;
            }
            66% { 
                transform: translate(45px, 35px) scale(0.9);
                border-radius: 50% 50% 30% 70% / 50% 60% 40% 60%;
            }
            100% { 
                transform: translate(0, 0) scale(1);
                border-radius: 30% 70% 70% 30% / 50% 50% 50% 50%;
            }
        }
        
        .animate-slide {
            animation: slide 1s infinite alternate ease-in-out;
        }
        
        .animate-slide-delay {
            animation: slide 1s infinite alternate ease-in-out;
            animation-delay: 0.3s;
        }
        
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
        }
        
        .fade-in-up.animate {
            animation: fadeUp 1s forwards;
        }
        
        .fade-in-up.delay-1.animate { animation-delay: 0.2s; }
        .fade-in-up.delay-2.animate { animation-delay: 0.5s; }
        .fade-in-up.delay-3.animate { animation-delay: 0.8s; }

        /* Floating blobs */
        .floating-blob {
            position: fixed;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            filter: blur(40px);
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }

        .blob-1 {
            width: 280px;
            height: 280px;
            top: 5%;
            right: 8%;
            animation: float1 8s ease-in-out infinite;
        }

        .blob-2 {
            width: 220px;
            height: 220px;
            bottom: 10%;
            right: 20%;
            animation: float2 10s ease-in-out infinite;
        }

        .blob-3 {
            width: 250px;
            height: 250px;
            top: 50%;
            right: 35%;
            animation: float3 9s ease-in-out infinite;
        }

        .blob-4 {
            width: 240px;
            height: 240px;
            top: 30%;
            right: 5%;
            animation: float4 7s ease-in-out infinite;
        }

        /* Light mode: use dark mode colors for blobs */
        body.light .blob-1 { background-color: #2A3740; }
        body.light .blob-2 { background-color: #1e2830; }
        body.light .blob-3 { background-color: #2A3740; }
        body.light .blob-4 { background-color: #1e2830; }

        /* Dark mode: use light mode colors for blobs */
        body.dark .blob-1 { background-color: #fffdfd; }
        body.dark .blob-2 { background-color: #f0f0f0; }
        body.dark .blob-3 { background-color: #fffdfd; }
        body.dark .blob-4 { background-color: #f0f0f0; }
        
        /* Dark mode background */
        body.dark {
            background-color: #2A3740;
            color: #fff;
        }
        
        body.light {
            background-color: #fffdfdec;
            color: #1e1e1e;
        }

        /* Content should be above blobs */
        nav, .hero-section, section {
            position: relative;
            z-index: 1;
        }
        
        /* Profile pic shape */
        .profile-pic {
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        }

        /* Contact form inputs in light mode */
        body.light .contact-input {
            background-color: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.15);
            color: #1e1e1e;
        }

        body.light .contact-input:focus {
            background-color: rgba(0, 0, 0, 0.08);
            border-color: rgba(0, 0, 0, 0.3);
        }

        body.light .contact-input::placeholder {
            color: rgba(0, 0, 0, 0.4);
        }

        /* Contact form inputs in dark mode */
        body.dark .contact-input {
            color: #fff;
        }

        body.dark .contact-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Contact section title color */
        body.light #contact h2 {
            color: #3d3d3d;
        }

        body.dark #contact h2 {
            color: #c9c9c9;
        }

        /* Contact title split colors */
        body.light .contact-title-first {
            color: #5a5a5a;
        }

        body.light .contact-title-second {
            color: #1e1e1e;
        }

        body.dark .contact-title-first {
            color: #9a9a9a;
        }

        body.dark .contact-title-second {
            color: #ffffff;
        }

        /* Card shadows in dark mode */
        body.dark #contact .shadow-lg {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
        }

        body.dark #contact .hover\:shadow-2xl:hover {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Submit button shadow in dark mode */
        body.dark .submit-btn {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
        }

        body.dark .submit-btn:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* Submit button in light mode */
        body.light .submit-btn {
            background-color: #1e1e1e;
            color: #fff;
        }

        body.light .submit-btn:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        body.dark .submit-btn {
            background-color: #fff;
            color: #1e1e1e;
        }

        /* Responsive adjustments for mobile */
        @media (max-width: 768px) {
            #contact h2 {
                font-size: clamp(32px, 8vw, 45px) !important;
                line-height: 1.2;
            }

            #contact .grid {
                grid-template-columns: 1fr;
            }

            nav .nav-links {
                display: none;
            }

            nav {
                justify-content: center;
                padding: 12px 20px !important;
            }

            .hero-section {
                padding-top: 100px !important;
                padding-left: 20px;
                padding-right: 20px;
            }

            .hero-section .content {
                flex-direction: column-reverse !important;
                gap: 40px !important;
            }

            .hero-section .text-content {
                text-align: center;
            }

            .profile-pic {
                width: 280px !important;
                height: 400px !important;
            }

            .name {
                font-size: clamp(48px, 12vw, 70px) !important;
                text-align: center !important;
            }

            .name .surname {
                left: 0 !important;
                display: inline !important;
            }

            .greeting {
                text-align: center;
            }

            .social-icons {
                left: 0 !important;
                justify-content: center !important;
                margin-left: 0 !important;
            }

            .hire-btn {
                left: 0 !important;
                margin: 0 auto;
                display: block;
            }

            /* Adjust blob sizes for mobile */
            .blob-1, .blob-2, .blob-3, .blob-4 {
                width: 120px !important;
                height: 120px !important;
            }
        }

        @media (max-width: 480px) {
            .hero-section {
                padding-top: 80px !important;
            }

            .profile-pic {
                width: 240px !important;
                height: 350px !important;
            }

            .name {
                font-size: clamp(40px, 12vw, 60px) !important;
            }

            #contact h2 {
                font-size: clamp(28px, 8vw, 40px) !important;
            }

            #contact .rounded-3xl {
                padding: 20px !important;
            }

            #contact form {
                padding: 20px !important;
            }

            .greeting {
                font-size: 13px;
            }

            .social-icons a {
                font-size: 18px;
            }
        }
    </style>
</head>

    <!-- Theme Toggle Button -->
    <button class="theme-toggle fixed bottom-9 right-9 w-12 h-12 rounded-full border-none cursor-pointer flex justify-center items-center transition-all duration-300 ease-in-out z-[1000] bg-black/85 text-white hover:scale-110 hover:rotate-12" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>

    <script>
        // Smooth scroll behavior
        document.documentElement.style.scrollBehavior = 'smooth';

        window.addEventListener('load', () => {
            const loadingScreen = document.getElementById('loadingScreen');
            setTimeout(() => {
                loadingScreen.classList.add('opacity-0', 'invisible');
                
                document.querySelectorAll('.fade-in-up').forEach(el => {
                    el.classList.add('animate');
                });
            }, 1500);
        });

        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        const fadeElements = document.querySelectorAll('.fade-in-up');
        const navbar = document.getElementById('navbar');

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark');
            body.classList.toggle('light');
            icon.classList.toggle('fa-moon');
            icon.classList.toggle('fa-sun');

            // Update nav active state for dark mode
            const activeLink = document.querySelector('.nav-links a.active');
            if (body.classList.contains('dark')) {
                themeToggle.classList.remove('bg-black/85');
                themeToggle.classList.add('bg-white/[0.18]');
                if (activeLink) {
                    activeLink.classList.remove('bg-black/80');
                    activeLink.classList.add('bg-white/[0.2]');
                }
            } else {
                themeToggle.classList.remove('bg-white/[0.18]');
                themeToggle.classList.add('bg-black/85');
                if (activeLink) {
                    activeLink.classList.remove('bg-white/[0.2]');
                    activeLink.classList.add('bg-black/80');
                }
            }

            // Update hire button
            const hireBtn = document.querySelector('.hire-btn');
            if (body.classList.contains('dark')) {
                hireBtn.classList.remove('bg-[#1e1e1e]', 'text-white');
                hireBtn.classList.add('bg-white', 'text-[#111]');
            } else {
                hireBtn.classList.remove('bg-white', 'text-[#111]');
                hireBtn.classList.add('bg-[#1e1e1e]', 'text-white');
            }

            // Update profile pic shadow
            const profilePic = document.querySelector('.profile-pic');
            if (body.classList.contains('dark')) {
                profilePic.style.filter = 'drop-shadow(0 16px 30px rgba(255,255,255,0.18))';
                profilePic.addEventListener('mouseenter', () => {
                    profilePic.style.filter = 'drop-shadow(0 20px 40px rgba(255,255,255,0.2))';
                });
                profilePic.addEventListener('mouseleave', () => {
                    profilePic.style.filter = 'drop-shadow(0 16px 30px rgba(255,255,255,0.18))';
                });
            } else {
                profilePic.style.filter = 'drop-shadow(0 16px 30px rgba(0,0,0,0.25))';
                profilePic.addEventListener('mouseenter', () => {
                    profilePic.style.filter = 'drop-shadow(0 20px 40px rgba(0,0,0,0.35))';
                });
                profilePic.addEventListener('mouseleave', () => {
                    profilePic.style.filter = 'drop-shadow(0 16px 30px rgba(0,0,0,0.25))';
                });
            }

            fadeElements.forEach(el => {
                el.classList.remove('animate');          
                void el.offsetWidth;   
                el.classList.add('animate');             
            });
        });

        // Initialize profile pic shadow on load
        const profilePic = document.querySelector('.profile-pic');
        profilePic.style.filter = 'drop-shadow(0 16px 30px rgba(0,0,0,0.25))';
        profilePic.addEventListener('mouseenter', () => {
            if (body.classList.contains('light')) {
                profilePic.style.filter = 'drop-shadow(0 20px 40px rgba(0,0,0,0.35))';
            } else {
                profilePic.style.filter = 'drop-shadow(0 20px 40px rgba(255,255,255,0.2))';
            }
        });
        profilePic.addEventListener('mouseleave', () => {
            if (body.classList.contains('light')) {
                profilePic.style.filter = 'drop-shadow(0 16px 30px rgba(0,0,0,0.25))';
            } else {
                profilePic.style.filter = 'drop-shadow(0 16px 30px rgba(255,255,255,0.18))';
            }
        });

        const navLinks = document.querySelectorAll('nav a');
        navLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                
                // Update active states
                navLinks.forEach(l => {
                    l.classList.remove('active', 'bg-black/80', 'bg-white/[0.2]', 'text-white');
                });
                this.classList.add('active');
                if (body.classList.contains('dark')) {
                    this.classList.add('bg-white/[0.2]', 'text-white');
                } else {
                    this.classList.add('bg-black/80', 'text-white');
                }

                // Scroll to section
                const targetId = this.getAttribute('href');
                const targetSection = document.querySelector(targetId);
                if (targetSection) {
                    targetSection.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        window.addEventListener('scroll', () => {
            // Navbar scroll effect
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
                navbar.classList.remove('py-1.5', 'px-[60px]');
                navbar.classList.add('py-3', 'px-[46px]');
                
                if (body.classList.contains('dark')) {
                    navbar.classList.remove('bg-white/5');
                    navbar.classList.add('bg-[#2A3740]/90', 'shadow-[0_4px_20px_rgba(0,0,0,0.1)]');
                } else {
                    navbar.classList.remove('bg-white/5');
                    navbar.classList.add('bg-white/85', 'shadow-[0_4px_20px_rgba(0,0,0,0.1)]');
                }
            } else {
                navbar.classList.remove('scrolled', 'py-3', 'px-[46px]', 'bg-white/85', 'bg-[#2A3740]/90', 'shadow-[0_4px_20px_rgba(0,0,0,0.1)]');
                navbar.classList.add('py-1.5', 'px-[60px]', 'bg-white/5');
            }

            // Scroll spy for active nav links
            const sections = document.querySelectorAll('section, .hero-section');
            const scrollPos = window.scrollY + 100;

            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                const sectionHeight = section.offsetHeight;
                const sectionId = section.getAttribute('id');

                if (scrollPos >= sectionTop && scrollPos < sectionTop + sectionHeight) {
                    navLinks.forEach(link => {
                        link.classList.remove('active', 'bg-black/80', 'bg-white/[0.2]', 'text-white');
                        
                        if (link.getAttribute('href') === `#${sectionId}`) {
                            link.classList.add('active');
                            if (body.classList.contains('dark')) {
                                link.classList.add('bg-white/[0.2]', 'text-white');
                            } else {
                                link.classList.add('bg-black/80', 'text-white');
                            }
                        }
                    });
                }
            });
        });

        // Contact form submission
        const contactForm = document.getElementById('contactForm');
        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // Add your form submission logic here
            alert('Message sent! (This is a demo - connect to your backend)');
            contactForm.reset();
        });
    </script>
</body>
</html>
